name: Fuzz (nightly)

# Every fuzz target for 10 minutes (input `seconds` on manual runs), starting from the
# seed corpus (fixtures) plus the corpus kept from earlier runs. Crashes are uploaded as
# artifacts and fail the job. PRs run each target for 30 s in ci.yml (job `fuzz`).
# The target list is dynamic: adding `fuzz/fuzz_targets/<name>.rs` plus its `[[bin]]`
# is enough. While no target exists the matrix is empty and `fuzz` is skipped.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: "600"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  list:
    name: list
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: List the targets
        id: list
        run: |
          set -euo pipefail
          shopt -s nullglob
          sources=(fuzz/fuzz_targets/*.rs)
          if [[ ${#sources[@]} -eq 0 ]]; then
            targets='[]' # cargo-fuzz rejects a crate without targets
          else
            targets="$(cargo +nightly fuzz list | jq -R . | jq -cs .)"
          fi
          echo "targets: $targets"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  fuzz:
    name: fuzz ${{ matrix.target }}
    needs: list
    if: needs.list.outputs.targets != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.list.outputs.targets) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Restore the corpus of earlier runs
        uses: actions/cache@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Seed corpus
        run: fuzz/seed-corpus.sh
      - name: Run ${{ matrix.target }}
        env:
          SECONDS_PER_TARGET: ${{ inputs.seconds || '600' }}
          TARGET: ${{ matrix.target }}
        run: >-
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu "$TARGET"
          "fuzz/corpus/$TARGET"
          -- -max_total_time=${SECONDS_PER_TARGET} -rss_limit_mb=2048 -timeout=10
      - name: Minimize the corpus
        if: success()
        env:
          TARGET: ${{ matrix.target }}
        run: cargo +nightly fuzz cmin --target x86_64-unknown-linux-gnu "$TARGET" "fuzz/corpus/$TARGET"
      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore

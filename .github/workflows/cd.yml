name: CD # Continuous Deployment

# T00: releases come from a version tag `vX.Y.Z` (e.g. `git tag v1.0.0 && git push
# origin v1.0.0`); the tag must match `workspace.package.version` in Cargo.toml. The
# tag builds and publishes:
#   - courier-ftp-<v>-linux-{x86_64,aarch64}.tar.gz   static musl client
#   - courier-ftp-<v>-macos-universal.tar.gz           lipo of x86_64 + aarch64
#   - courier-ftp-<v>-windows-x86_64.zip
#   - SHA256SUMS, one .sha256 per archive, an SBOM (CycloneDX)
#   - the AUR (courier-ftp, courier-ftp-bin), Homebrew tap and Scoop bucket updates
# Every archive holds the man page and shell completions (`courier-ftp generate`).
# T86 adds the sync server: its static binaries and the
# ghcr.io/<owner>/courier-ftp-server image (amd64 + arm64, smoke tested).
#
# `workflow_dispatch` (Actions tab, "Run workflow") is always a dry run: every build and
# check (static/universal binaries, reproducibility) runs and the artifacts are
# uploaded to the run; nothing is published.
#
# Secrets (all optional except GITHUB_TOKEN; a missing one skips its channel):
#   AUR_SSH_PRIVATE_KEY, HOMEBREW_TAP_TOKEN, SCOOP_BUCKET_TOKEN,
#   APPLE_CERTIFICATE_P12 / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY /
#   APPLE_NOTARY_KEY / APPLE_NOTARY_KEY_ID / APPLE_NOTARY_ISSUER (macOS signing and
#   notarization; without them the binary is unsigned).

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  # Manual runs are dry runs only (see `meta`): releases come from tags.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  meta:
    name: Release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      publish: ${{ steps.meta.outputs.publish }}
      source-date-epoch: ${{ steps.meta.outputs.source-date-epoch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: meta
        name: Version, publish flag, SOURCE_DATE_EPOCH
        run: |
          cargo_version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["version"])')"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ "$version" != "$cargo_version" ]]; then
              echo "::error::tag $GITHUB_REF_NAME does not match the workspace version $cargo_version"
              exit 1
            fi
            publish=true
          else
            # Not a tag (a manual run): never publish.
            version="$cargo_version"
            publish=false
          fi
          {
            echo "version=$version"
            echo "publish=$publish"
            echo "source-date-epoch=$(git log -1 --format=%ct)"
          } >>"$GITHUB_OUTPUT"
          echo "version $version, publish $publish"

  assets:
    name: Man page and completions
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Generate
        run: |
          export COURIER_FTP_HOME="$RUNNER_TEMP/courier-ftp-home"
          cargo build --locked -p courier-ftp
          bin=target/debug/courier-ftp
          mkdir -p assets/man assets/completions
          "$bin" generate man --out-dir assets/man
          "$bin" generate completions bash >assets/completions/courier-ftp.bash
          "$bin" generate completions zsh >assets/completions/_courier-ftp
          "$bin" generate completions fish >assets/completions/courier-ftp.fish
          "$bin" generate completions powershell >assets/completions/_courier-ftp.ps1
          bash -n assets/completions/courier-ftp.bash
          sudo apt-get install -y --no-install-recommends groff-base >/dev/null
          groff -man -ww -z assets/man/courier-ftp.1
      - uses: actions/upload-artifact@v4
        with:
          name: courier-ftp-assets
          path: assets

  linux:
    name: Linux ${{ matrix.arch }} (musl)
    needs: [meta, assets]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-musl
            cross: false
          - arch: aarch64
            target: aarch64-unknown-linux-musl
            cross: true
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      SOURCE_DATE_EPOCH: ${{ needs.meta.outputs.source-date-epoch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # vergen stamps `git describe`
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: musl toolchain
        if: ${{ !matrix.cross }}
        run: sudo apt-get install -y --no-install-recommends musl-tools
      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build (reproducible flags)
        run: |
          # --locked, SOURCE_DATE_EPOCH, stripped, paths remapped so the checkout
          # location and the cargo home don't end up in the binary.
          export RUSTFLAGS="-C target-feature=+crt-static -C strip=symbols --remap-path-prefix=$GITHUB_WORKSPACE=/build/courier-ftp --remap-path-prefix=$HOME/.cargo=/cargo"
          tool=cargo
          if [[ "${{ matrix.cross }}" == true ]]; then tool=cross; fi
          "$tool" build --locked --release -p courier-ftp --target ${{ matrix.target }}
      - name: Static binaries
        run: |
          for b in courier-ftp; do
            f="target/${{ matrix.target }}/release/$b"
            file "$f"
            file "$f" | grep -Eq 'statically linked|static-pie linked' || { echo "::error::$b is not static"; exit 1; }
          done
      - name: Reproducible
        if: ${{ !matrix.cross }}
        run: |
          # A second, independent build from another directory must be byte-identical.
          other="$RUNNER_TEMP/rebuild"
          git worktree add --detach "$other" HEAD
          (
            cd "$other"
            export RUSTFLAGS="-C target-feature=+crt-static -C strip=symbols --remap-path-prefix=$other=/build/courier-ftp --remap-path-prefix=$HOME/.cargo=/cargo"
            CARGO_TARGET_DIR="$RUNNER_TEMP/rebuild-target" cargo build --locked --release -p courier-ftp --target ${{ matrix.target }}
          )
          for b in courier-ftp; do
            a="target/${{ matrix.target }}/release/$b"
            b2="$RUNNER_TEMP/rebuild-target/${{ matrix.target }}/release/$b"
            sha256sum "$a" "$b2"
            cmp "$a" "$b2" || { echo "::error::$b is not reproducible"; exit 1; }
          done
      - uses: actions/download-artifact@v4
        with:
          name: courier-ftp-assets
          path: assets
      - name: Package
        run: |
          r="target/${{ matrix.target }}/release"
          scripts/release-package.sh courier-ftp "$VERSION" linux-${{ matrix.arch }} "$r/courier-ftp" dist assets
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux-${{ matrix.arch }}
          path: dist

  macos:
    name: macOS universal
    needs: [meta, assets]
    runs-on: macos-14
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      SOURCE_DATE_EPOCH: ${{ needs.meta.outputs.source-date-epoch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - name: Build both architectures
        run: |
          export RUSTFLAGS="-C strip=symbols --remap-path-prefix=$GITHUB_WORKSPACE=/build/courier-ftp --remap-path-prefix=$HOME/.cargo=/cargo"
          for t in x86_64-apple-darwin aarch64-apple-darwin; do
            cargo build --locked --release -p courier-ftp --target "$t"
          done
      - name: lipo
        run: |
          mkdir -p universal
          lipo -create -output universal/courier-ftp \
            target/x86_64-apple-darwin/release/courier-ftp \
            target/aarch64-apple-darwin/release/courier-ftp
          lipo -info universal/courier-ftp
          lipo -info universal/courier-ftp | grep -q x86_64
          lipo -info universal/courier-ftp | grep -q arm64
      - name: Sign and notarize (when the secrets exist)
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
        run: |
          if [[ -z "$APPLE_CERTIFICATE_P12" || -z "$APPLE_SIGNING_IDENTITY" ]]; then
            echo "::notice::no signing certificate; the macOS binary is unsigned (T77 docs: Gatekeeper)"
            exit 0
          fi
          kc="$RUNNER_TEMP/build.keychain"
          security create-keychain -p ci "$kc"
          security default-keychain -s "$kc"
          security unlock-keychain -p ci "$kc"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode >"$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$kc" >/dev/null
          codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" universal/courier-ftp
          codesign --verify --verbose universal/courier-ftp
          if [[ -n "$APPLE_NOTARY_KEY" ]]; then
            echo "$APPLE_NOTARY_KEY" >"$RUNNER_TEMP/notary.p8"
            ditto -c -k universal/courier-ftp "$RUNNER_TEMP/courier-ftp.zip"
            xcrun notarytool submit "$RUNNER_TEMP/courier-ftp.zip" --wait \
              --key "$RUNNER_TEMP/notary.p8" --key-id "$APPLE_NOTARY_KEY_ID" --issuer "$APPLE_NOTARY_ISSUER"
          fi
      - uses: actions/download-artifact@v4
        with:
          name: courier-ftp-assets
          path: assets
      - name: Package
        run: |
          brew list gnu-tar >/dev/null 2>&1 || brew install gnu-tar
          scripts/release-package.sh courier-ftp "$VERSION" macos-universal universal/courier-ftp dist assets
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos-universal
          path: dist

  windows:
    name: Windows x86_64
    needs: [meta, assets]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      SOURCE_DATE_EPOCH: ${{ needs.meta.outputs.source-date-epoch }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Disable CRLF conversion
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build
        run: cargo build --locked --release -p courier-ftp --target x86_64-pc-windows-msvc
      - uses: actions/download-artifact@v4
        with:
          name: courier-ftp-assets
          path: assets
      - name: Package
        run: |
          scripts/release-package.sh courier-ftp "$VERSION" windows-x86_64 \
            target/x86_64-pc-windows-msvc/release/courier-ftp.exe dist assets
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows-x86_64
          path: dist

  release:
    name: GitHub release
    needs: [meta, linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: SBOM (CycloneDX)
        continue-on-error: true
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-cyclonedx
      - name: Write the SBOM and SHA256SUMS
        run: |
          if command -v cargo-cyclonedx >/dev/null; then
            cargo cyclonedx --format json --target all -p courier-ftp --override-filename "courier-ftp-$VERSION.cdx" || true
            find crates/courier-ftp -name "courier-ftp-$VERSION.cdx.json" -exec mv {} dist/ \;
          fi
          cd dist
          cat ./*.sha256 | sort -k2 >SHA256SUMS
          sha256sum -c SHA256SUMS
          ls -l
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            /^## \[/ { if (on) exit; on = index($0, "[" v "]") > 0; next }
            on' CHANGELOG.md >notes.md
          [[ -s notes.md ]] || echo "See CHANGELOG.md." >notes.md
      - name: Upload to the release
        if: needs.meta.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          body_path: notes.md
          files: dist/*
      - name: Keep the artifacts of a dry run
        if: needs.meta.outputs.publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-dry-run
          path: |
            dist
            notes.md

  channels:
    name: Package channels
    needs: [meta, release]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      SCOOP_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Checksums of the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v$VERSION" --pattern SHA256SUMS --dir release
          curl -fsSL "https://github.com/${{ github.repository }}/archive/refs/tags/v$VERSION.tar.gz" | sha256sum | cut -d' ' -f1 >release/source.sha256
          python3 scripts/update-packaging.py "$VERSION" release/SHA256SUMS \
            --source-sha256 "$(cat release/source.sha256)" --out out
      - name: AUR courier-ftp
        if: env.AUR_KEY != ''
        uses: KSXGitHub/github-actions-deploy-aur@v3
        with:
          pkgname: courier-ftp
          pkgbuild: out/packaging/aur/courier-ftp/PKGBUILD
          commit_username: courier-ftp-release
          commit_email: release@users.noreply.github.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: courier-ftp ${{ env.VERSION }}
      - name: AUR courier-ftp-bin
        if: env.AUR_KEY != ''
        uses: KSXGitHub/github-actions-deploy-aur@v3
        with:
          pkgname: courier-ftp-bin
          pkgbuild: out/packaging/aur/courier-ftp-bin/PKGBUILD
          commit_username: courier-ftp-release
          commit_email: release@users.noreply.github.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: courier-ftp-bin ${{ env.VERSION }}
      - name: Homebrew tap
        if: env.TAP_TOKEN != ''
        run: |
          git clone "https://x-access-token:$TAP_TOKEN@github.com/${{ github.repository_owner }}/homebrew-courier-ftp.git" tap
          mkdir -p tap/Formula
          cp out/packaging/homebrew/courier-ftp.rb tap/Formula/courier-ftp.rb
          cd tap
          git config user.name courier-ftp-release
          git config user.email release@users.noreply.github.com
          git add Formula/courier-ftp.rb
          git commit -m "courier-ftp $VERSION" && git push
      - name: Scoop bucket
        if: env.SCOOP_TOKEN != ''
        run: |
          git clone "https://x-access-token:$SCOOP_TOKEN@github.com/${{ github.repository_owner }}/scoop-courier-ftp.git" bucket
          mkdir -p bucket/bucket
          cp out/packaging/scoop/courier-ftp.json bucket/bucket/courier-ftp.json
          cd bucket
          git config user.name courier-ftp-release
          git config user.email release@users.noreply.github.com
          git add bucket/courier-ftp.json
          git commit -m "courier-ftp $VERSION" && git push

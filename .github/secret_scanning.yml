# GitHub secret scanning. The e2e fixtures (T76) contain TEST-ONLY private keys,
# certificates and CAs; they protect nothing.
paths-ignore:
  - "tests/fixtures/sshd/keys/**"
  - "tests/fixtures/tls/**"
  - "tests/fixtures/ftpd/tls/**"
  - "tests/fixtures/keys/**"
  - "crates/courier-ftp-proto-sftp/tests/keys/**"

[package]
name = "courier-ftp-proto-ftp"
description = "FTP and FTPS client for courier-ftp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

# Keep this crate UI-agnostic: no ratatui, no crossterm, no clap
# (scripts/check-layering.py and deny.toml enforce it).
[dependencies]
courier-ftp-core = { workspace = true }
encoding_rs = { workspace = true }
serde = { workspace = true }
time = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
insta = { workspace = true, features = ["glob", "yaml"] }
proptest = { workspace = true }
serde_json = { workspace = true }

# Listing parser throughput (T13, AC10).
[[bench]]
name = "listing"
harness = false

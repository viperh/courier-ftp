[package]
name = "courier-ftp"
description = "A terminal FTP, FTPS and SFTP client"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
build = "build.rs"

# `errors.rs` reads CARGO_PKG_REPOSITORY at compile time for the panic message,
# so `repository` above must stay set.

[features]
default = ["sync"]
# Device sync through a courier-ftp server (D12). Without it the client is
# local-only; everything else works the same.
sync = [
    "dep:courier-ftp-sync",
    "dep:courier-ftp-proto",
    "dep:hostname",
    "dep:qrcodegen",
    "dep:uuid",
]

[dependencies]
unicode-width = { workspace = true }
courier-ftp-core = { workspace = true }
courier-ftp-crypto = { workspace = true }
courier-ftp-proto-ftp = { workspace = true }
courier-ftp-proto-sftp = { workspace = true }
courier-ftp-store = { workspace = true }
courier-ftp-sync = { workspace = true, optional = true }
# Sync account screens (T90), only with feature `sync`: wire types of the
# devices list, the default device name and the TOTP QR code.
courier-ftp-proto = { workspace = true, optional = true }
hostname = { workspace = true, optional = true }
qrcodegen = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

async-trait = { workspace = true }
better-panic = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
clap_mangen = { workspace = true }
color-eyre = { workspace = true }
config = { workspace = true }
crossterm = { workspace = true }
directories = { workspace = true }
encoding_rs = { workspace = true }
futures = { workspace = true }
human-panic = { workspace = true }
json5 = { workspace = true }
libc = { workspace = true }
ratatui = { workspace = true }
# The update check (T74): already linked through courier-ftp-sync; rustls with
# the `ring` provider and the OS trust store (D9).
reqwest = { workspace = true }
rustls = { workspace = true }
rustls-platform-verifier = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
strip-ansi-escapes = { workspace = true }
strum = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-error = { workspace = true }
tracing-subscriber = { workspace = true }
zeroize = { workspace = true }

# `Tui::suspend` raises SIGTSTP, which only exists on unix.
[target.'cfg(not(windows))'.dependencies]
signal-hook = { workspace = true }

[build-dependencies]
anyhow = { workspace = true }
vergen-gix = { workspace = true }

[dev-dependencies]
courier-ftp-core = { workspace = true, features = ["test-util"] }
# Cheap Argon2 (`Argon2Cost::TEST`) for the vault UI tests. Dev-only: never
# in a normal build.
courier-ftp-crypto = { workspace = true, features = ["insecure-test-ksf"] }
pretty_assertions = { workspace = true }
insta = { workspace = true }
tempfile = { workspace = true }
# The in-process sync server the T90 flow tests drive (in-memory store).
# Path-only so `cargo package` strips it; dev-only, so the client build never
# links it (scripts/check-layering.py looks at normal dependencies).
courier-ftp-server = { path = "../courier-ftp-server" }
axum = { workspace = true }
# The server's manual clock (the TOTP test steps it).
chrono = { workspace = true }
rustls = { workspace = true }

[lints]
workspace = true

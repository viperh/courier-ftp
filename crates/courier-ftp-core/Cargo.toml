[package]
name = "courier-ftp-core"
description = "Domain logic for courier-ftp, independent of any user interface"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# `MockBackend` and the backend conformance suite (T03, T06).
test-util = ["dep:bytes"]

# Keep this crate UI-agnostic: no ratatui, no crossterm, no clap
# (scripts/check-layering.py and deny.toml enforce it).
[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true, optional = true }
ciborium = { workspace = true }
directories = { workspace = true }
encoding_rs = { workspace = true }
filetime = { workspace = true }
fs4 = { workspace = true }
futures = { workspace = true }
globset = { workspace = true }
percent-encoding = { workspace = true }
regex = { workspace = true }
schemars = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
socket2 = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
time = { workspace = true, features = ["serde-well-known"] }
tracing = { workspace = true }
uhlc = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# `fallocate(KEEP_SIZE)` for the local backend's preallocation (T06).
rustix = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Owner/group names in local listings (T06).
uzers = { workspace = true }

[dev-dependencies]
bytes = { workspace = true }
criterion = { workspace = true }
insta = { workspace = true, features = ["glob", "yaml"] }
pretty_assertions = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true }

# Filter evaluation speed (T47, AC8).
[[bench]]
name = "filters"
harness = false

# Listing cache patch speed (T46, AC10).
[[bench]]
name = "cache"
harness = false

[lints]
workspace = true

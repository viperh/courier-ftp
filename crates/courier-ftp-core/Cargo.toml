[package]
name = "courier-ftp-core"
description = "Domain logic for courier-ftp, independent of any user interface"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# Keep this crate UI-agnostic: no ratatui, no crossterm, no clap.
# Everything here should be testable without a terminal.
[features]
# MockBackend / MockServer for other crates' tests (T03).
test-util = []

[dependencies]
async-trait = { workspace = true }
# Item model (model::item, T81): CBOR bodies, HLC stamps, UUIDv7 ids.
ciborium = { workspace = true }
uhlc = { workspace = true }
uuid = { workspace = true }
encoding_rs = { workspace = true }
fs4 = { workspace = true }
regex = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
socket2 = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
uzers = { workspace = true }

[dev-dependencies]
# The item model's CBOR bytes are what the envelope seals (model::item tests).
courier-ftp-crypto = { workspace = true }
criterion = { workspace = true }
pretty_assertions = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[[bench]]
name = "filters"
harness = false

[lints]
workspace = true

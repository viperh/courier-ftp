[package]
name = "courier-ftp-core"
description = "Domain logic for courier-ftp, independent of any user interface"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# `MockBackend` and the backend conformance suite (T03, T06).
test-util = []

# Keep this crate UI-agnostic: no ratatui, no crossterm, no clap
# (scripts/check-layering.py and deny.toml enforce it).
[dependencies]
directories = { workspace = true }
encoding_rs = { workspace = true }
percent-encoding = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true, features = ["serde-well-known"] }
tracing = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
insta = { workspace = true, features = ["glob", "yaml"] }
pretty_assertions = { workspace = true }
proptest = { workspace = true }
serde_json = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true

[package]
name = "courier-ftp-store"
description = "Encrypted SQLite item store for courier-ftp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# Keep this crate UI-agnostic: no ratatui, no crossterm, no clap.
[dependencies]
courier-ftp-core = { workspace = true }
courier-ftp-crypto = { workspace = true }

# SQLite (bundled: compiled from source with `cc`, so no system library is
# needed on Linux, macOS or Windows), versioned migrations, async wrappers.
rusqlite = { workspace = true }
rusqlite_migration = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
# Site passwords in the no-plaintext canary test.
secrecy = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true

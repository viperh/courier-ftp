[package]
name = "courier-ftp-server"
description = "Self-hosted, end-to-end encrypted sync server for courier-ftp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "courier-ftp-server"
path = "src/main.rs"

[lints]
workspace = true

# No ratatui, no crossterm, and no client crates (core, protocol crates,
# store, sync): the server's heavy dependencies must not leak into the
# client build, and the client's must not leak into the server.
[dependencies]
courier-ftp-crypto = { workspace = true }
courier-ftp-proto = { workspace = true }

# squid on :3128, basic authentication proxyuser/proxypass (TEST-ONLY).
http_port 3128
cache deny all
access_log stdio:/var/log/squid/access.log
cache_log /var/log/squid/cache.log
pid_filename /run/squid-courier.pid
coredump_dir /tmp
acl CONNECT method CONNECT
acl tunnel_ports port 21 22 990 30000-30019
http_access deny CONNECT !tunnel_ports
auth_param basic program /usr/lib/squid/basic_ncsa_auth /etc/squid/courier-passwd
auth_param basic realm courier-ftp-e2e
acl authed proxy_auth REQUIRED
http_access allow authed
http_access deny all

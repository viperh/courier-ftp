# squid on :3128, no authentication; CONNECT only to FTP/SSH ports.
http_port 3128
cache deny all
access_log stdio:/var/log/squid/access.log
cache_log /var/log/squid/cache.log
pid_filename /run/squid-courier.pid
coredump_dir /tmp
acl CONNECT method CONNECT
acl tunnel_ports port 21 22 990 30000-30019
http_access deny CONNECT !tunnel_ports
http_access allow all

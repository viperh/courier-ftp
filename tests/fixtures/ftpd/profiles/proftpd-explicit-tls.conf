# proftpd + mod_tls, TLS required; data connections must reuse the TLS session
# (NoSessionReuseRequired is not set).
LoadModule mod_tls.c
<IfModule mod_tls.c>
  TLSEngine on
  TLSRequired on
  TLSProtocol TLSv1.2 TLSv1.3
  TLSRSACertificateFile /etc/courier-ftpd/tls/cert.pem
  TLSRSACertificateKeyFile /etc/courier-ftpd/tls/key.pem
  TLSVerifyClient off
  TLSLog /var/log/proftpd-tls.log
</IfModule>

# Base proftpd configuration; the entrypoint appends the profile (profiles/proftpd-*.conf).
ServerName "courier-ftp-e2e proftpd"
ServerType standalone
DefaultServer on
ModulePath /usr/lib/proftpd
UseIPv6 off
Port 21
User nobody
Group nogroup
Umask 022
MaxInstances 30
DefaultRoot ~
RequireValidShell off
AllowOverwrite on
PassivePorts 30000 30019
WtmpLog off
UseReverseDNS off
# mod_ident is a loadable module on Debian and not loaded here: no ident lookups.
<IfModule mod_ident.c>
  IdentLookups off
</IfModule>
DelayEngine off
SystemLog /var/log/proftpd.log
<Limit SITE_CHMOD>
  AllowAll
</Limit>

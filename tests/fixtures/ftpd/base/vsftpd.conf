# Base vsftpd configuration (profiles/vsftpd-*.conf override it: the entrypoint keeps
# the first occurrence of every key, profile first). PASV address and certificate
# paths are filled in by the entrypoint.
listen=YES
listen_ipv6=NO
listen_port=21
background=NO
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022
chroot_local_user=YES
pasv_enable=YES
pasv_min_port=30000
pasv_max_port=30019
pasv_addr_resolve=NO
port_enable=YES
connect_from_port_20=NO
seccomp_sandbox=NO
secure_chroot_dir=/var/run/vsftpd/empty
pam_service_name=vsftpd
utf8_filesystem=YES
max_per_ip=0
max_clients=0
dual_log_enable=YES
log_ftp_protocol=YES
vsftpd_log_file=/var/log/vsftpd.log
xferlog_file=/var/log/vsftpd-xfer.log
ssl_enable=NO
ssl_tlsv1=NO
ssl_sslv2=NO
ssl_sslv3=NO
ssl_ciphers=HIGH
rsa_cert_file=/etc/courier-ftpd/tls/cert.pem
rsa_private_key_file=/etc/courier-ftpd/tls/key.pem

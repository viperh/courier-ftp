[workspace]
resolver = "3"
members = ["crates/*"]
# The cargo-fuzz crate is its own workspace (nightly, libfuzzer-sys).
exclude = ["fuzz"]

# Values shared by every crate in the workspace. Each crate opts in with
# `version.workspace = true` etc. in its own Cargo.toml.
[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["qviperh <olteanromeodavid34@gmail.com>"]
license = "MIT"
repository = "https://github.com/viperh/courier-ftp"
# MSRV: the highest `rust-version` declared by the pinned dependency set
# (vergen-gix 10.0.1, later rusqlite_migration 2.6). CI job `msrv` checks it.
rust-version = "1.95"

# Lints shared by every crate (each crate opts in with `[lints] workspace = true`).
[workspace.lints.rust]
# `deny`, not `forbid`: `forbid` cannot be lifted by an inner `allow`, and the
# process-hardening module (`crates/courier-ftp-core/src/hardening/`, T91) needs one.
# `scripts/check-unsafe.py` (CI job `unsafe-check`) fails on any other `allow`.
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
await_holding_lock = "deny"
large_futures = "warn"

# Central dependency versions. Crates reference these with
# `some-dep = { workspace = true }` so versions stay in lockstep.
[workspace.dependencies]
# --- internal ---
courier-ftp-core = { path = "crates/courier-ftp-core" }

# --- tui / terminal ---
crossterm = { version = "0.29.0", features = ["serde", "event-stream"] }
ratatui = { version = "0.30.2", features = ["serde", "macros"] }
signal-hook = "0.4.4"

# --- async runtime ---
futures = "0.3.32"
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = "0.7.18"

# --- cli / config ---
clap = { version = "4.6.1", features = [
    "derive",
    "cargo",
    "wrap_help",
    "unicode",
    "string",
    "unstable-styles",
] }
config = "0.15.25"
directories = "6.0.0"
json5 = "1.3.1"
serde = { version = "1.0.228", features = ["derive"] }

# --- errors / diagnostics ---
better-panic = "0.3.0"
color-eyre = "0.6.5"
human-panic = "2.0.8"
strip-ansi-escapes = "0.2.1"
thiserror = "2.0.17"

# --- logging ---
tracing = "0.1.44"
tracing-error = "0.2.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "serde"] }

# --- misc ---
libc = "0.2.186"
strum = { version = "0.28.0", features = ["derive"] }

# --- build scripts ---
anyhow = "1.0.103"
vergen-gix = { version = "10.0.1", features = ["build", "cargo"] }

# --- dev ---
pretty_assertions = "1.4.1"

# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
# opt-level 3, not "s": transfer throughput (T41b) and render targets (T53) matter
# more than binary size. `panic = "unwind"`: the panic hook restores the terminal.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "unwind"
strip = true
